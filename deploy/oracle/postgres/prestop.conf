# Prestop tuning for a 2 OCPU / 12 GB OCI A1 instance (PostgreSQL 18 conf.d).
# A large buffer cache keeps the 2M stop times and the delay history in memory.
shared_buffers = 3GB
effective_cache_size = 7GB
work_mem = 32MB
maintenance_work_mem = 512MB
max_connections = 60
random_page_cost = 1.1
effective_io_concurrency = 100
checkpoint_completion_target = 0.9
max_wal_size = 2GB
wal_compression = on
# Load commonly used tables back into shared_buffers after a restart.
shared_preload_libraries = 'pg_prewarm'
pg_prewarm.autoprewarm = on
